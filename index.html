<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>事前受付</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>事前受付</h1>
  <span id="ver"></span>
</header>

<div id="banners"></div>

<nav id="groups" aria-label="グループ"></nav>

<main>
  <section id="scan">
    <div id="videoWrap">
      <video id="video" playsinline muted></video>
      <div id="camOff">カメラ停止中</div>
    </div>
    <div id="scanMsg" class="msg" role="status">「カメラを開始」を押して、会員 QR を写してください</div>
    <button id="camBtn" type="button" class="primary">カメラを開始</button>
  </section>

  <section id="list">
    <div class="groupHead">
      <h2 id="groupTitle"></h2>
      <input id="memo" type="text" maxlength="40" placeholder="メモ (例: 14:20 の回)" autocomplete="off">
    </div>
    <ol id="members"></ol>
    <p id="emptyHint">まだ誰も読み取っていません</p>
    <button id="showBtn" type="button" class="primary big">Host に渡す (まとめ QR を表示)</button>
    <button id="delGroupBtn" type="button" class="danger">このグループを消去</button>
  </section>

  <details id="settings">
    <summary>設定</summary>
    <label class="setting">
      <span>まとめ QR 1 枚あたりの人数 (超えたら自動で分ける)</span>
      <select id="setMax">
        <option value="2">2 人</option>
        <option value="3">3 人</option>
        <option value="4">4 人</option>
        <option value="5">5 人</option>
        <option value="6">6 人</option>
        <option value="8">8 人</option>
      </select>
    </label>
    <label class="setting">
      <span>発行日が本日の QR だけ受ける</span>
      <input id="setToday" type="checkbox">
    </label>
    <label class="setting">
      <span>読取音</span>
      <input id="setSound" type="checkbox">
    </label>
    <div class="setting">
      <span id="updateInfo"></span>
      <button id="updateBtn" type="button">最新版に更新</button>
    </div>
    <p id="storageInfo" class="note"></p>
    <p class="note">読み取ったリストはこの端末のブラウザにだけ保存され、消去ボタンを押すまで消えません (どこにも送信しません)。営業終了時に「すべて消去」を押してください。</p>
    <button id="clearAllBtn" type="button" class="danger">すべて消去</button>
  </details>
</main>

<div id="qrOverlay" hidden>
  <div id="qrTitle"></div>
  <canvas id="qrCanvas"></canvas>
  <div id="qrPart"></div>
  <div id="qrNames"></div>
  <div id="qrHint">Host の受付カメラにかざしてください (画面の明るさは最大に)</div>
  <button id="qrClose" type="button" class="primary big">閉じる</button>
</div>

<div id="dialog" hidden>
  <div class="dialogBox" role="alertdialog" aria-modal="true">
    <p id="dialogText"></p>
    <div class="dialogButtons">
      <button id="dialogCancel" type="button">キャンセル</button>
      <button id="dialogOk" type="button" class="danger">消去する</button>
    </div>
  </div>
</div>

<script src="version.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="codec.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
